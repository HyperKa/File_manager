services:
  postgres:
    image: postgres:16-alpine
    container_name: file-manager-postgres
    environment:
      POSTGRES_DB: file_manager
      POSTGRES_USER: file_manager
      POSTGRES_PASSWORD: file_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: file-manager-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio_storage:/data
    command: server /data --console-address ":9001"

  pgadmin:
    image: dpage/pgadmin4
    container_name: file-manager-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
