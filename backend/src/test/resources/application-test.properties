spring.datasource.url=jdbc:postgresql://localhost:5432/file_manager
spring.datasource.username=file_manager
spring.datasource.password=file_manager
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:/db/changelog/db.changelog.sql

app.storage.provider=s3
app.storage.s3.endpoint=http://localhost:9000
app.storage.s3.bucket=my-files
app.storage.s3.region=us-east-1
app.storage.s3.access-key=minioadmin
app.storage.s3.secret-key=minioadmin
app.storage.s3.path-style=true

app.security.api-token=test-token
app.security.default-user-id=00000000-0000-0000-0000-000000000001
