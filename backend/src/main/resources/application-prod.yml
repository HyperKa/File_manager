spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

app:
  storage:
    s3:
      endpoint: ${B2_S3_ENDPOINT}
      bucket: ${B2_BUCKET}
      region: ${B2_REGION:auto}
      access-key: ${B2_ACCESS_KEY_ID}
      secret-key: ${B2_APPLICATION_KEY}
      path-style: true
  security:
    api-token: ${API_TOKEN}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
